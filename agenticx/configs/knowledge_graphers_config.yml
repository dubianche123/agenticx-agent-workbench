grapher:
  type: graphrag
  llm:
    type: bailian
    model: qwen3-max-preview
    api_key: ""
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1/
    provider: bailian
  graphrag:
    chunk_size: 1000
    chunk_overlap: 200
    prompts:
      general: You are an expert information extractor...
    entity_extraction:
      extraction_method: llm
    relationship_extraction:
      extraction_method: llm
    quality_validation: {}
    community_detection: {}
    graph_optimization: {}
    neo4j:
      enabled: true  # Set to true to enable Neo4j export
      uri: "bolt://localhost:7687"
      username: "neo4j"
      password: "${NEO4J_PASSWORD}"  # Set this in your environment
      database: "neo4j"  # Use default database
      auto_export: false  # 🔧 改为手动控制导出，避免意外清空数据
      clear_on_export: false  # 🔧 改为不自动清空，保护现有数据
      create_indexes: true  # Create performance indexes
      batch_size: 1000  # Batch size for large exports
      timeout: 30  # Connection timeout in seconds
      
      # 🆕 新增数据集管理配置
      dataset_management:
        enable_isolation: true  # 启用数据集隔离
        default_dataset: "default"  # 默认数据集名称
        preserve_other_datasets: true  # 保护其他数据集